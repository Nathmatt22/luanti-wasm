name: wasm

# The web build, made from the branch this runs on rather than from the pins in
# wasmgame/build.sh: this fork already is the Luanti the port would otherwise
# patch, so there is no luanti.diff, and the build changes webport.diff made are
# made here instead. Artifacts: luanti.js, luanti.wasm, import-game.js and the
# two zips the play page loads.
on:
  push:
    branches: [wasmgame]
  pull_request:
    branches: [wasmgame]
  workflow_dispatch:

env:
  WEBPORT_REV: 5bfae52b53605b39667dfc29cddd59c861e38111
  MTG_REV: c42e4d0c0ff9d27ff7b9b308c3cfc14098dd3a0f
  # The public gateways the page offers still speak the protocol of 2022: they
  # resolve a name when asked at 10.0.0.1:53, and they give a client no address
  # to bind a socket on. The port pins the rewrite of September 2026, which asks
  # for both, so it is replaced with the revision the gateways answer.
  WEBSHIMS_PIN: 70653a91c974aa2b20df09a39f858d92e663c1a7
  WEBSHIMS_REV: 91c3fe85d2cb7f85cc8e19d3f53dc8f252a69ff7
  # Bumped when what the cache restores turns out to be unfit: a cache is saved
  # once and never updated, so a sysroot first archived without the SDL2 port
  # stays without it. 2: the SDL2 port was missing from the sysroot.
  DEPS_CACHE: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          path: luanti
          fetch-depth: 1

      - name: Set up Node.js (emsdk)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make g++ zip unzip wget curl python3 gettext tcl

      - name: Fetch the web port
        run: |
          git clone https://github.com/paradust7/minetest-wasm.git port
          git -C port checkout "$WEBPORT_REV"

      # emsdk and the dependency libraries only change when the port does, and
      # they take most of the run; the log of a failed build is not readable
      # from outside without a token, so a build that breaks has to be cheap to
      # try again.
      - name: Restore emsdk and the dependencies
        uses: actions/cache@v4
        with:
          path: |
            port/emsdk
            port/build
            port/sources
            port/.deps-ok
          key: wasm-deps-${{ env.WEBPORT_REV }}-${{ env.DEPS_CACHE }}

      - name: Fetch its sources
        # Installs and patches emsdk 6.0.8 through common.sh, and fetches zstd,
        # webshims, libarchive, libzip, curl and openssl. A restored cache is
        # already past all of that, and fetch_sources.sh would patch emsdk a
        # second time.
        working-directory: port
        run: |
          # A cold cache fetches what the script names, so the pin is changed
          # before it runs; the step below replaces a restored checkout. A pin
          # this no longer matches means the port moved: the change below has to
          # follow it, and the job says so rather than building the wrong one.
          if ! grep -q "$WEBSHIMS_PIN" fetch_sources.sh; then
            echo "::error::fetch_sources.sh no longer pins webshims at $WEBSHIMS_PIN"
            exit 1
          fi
          sed -i "s/$WEBSHIMS_PIN/$WEBSHIMS_REV/" fetch_sources.sh
          if [ -f .deps-ok ] && [ -d emsdk ] && [ -d sources ]; then
            echo "emsdk and the sources are restored from the cache"
          else
            ./fetch_sources.sh
          fi

      - name: Build this branch in place of the pinned Luanti
        run: |
          rm -rf port/sources/luanti
          cp -a luanti port/sources/luanti
          rm -rf port/sources/luanti/.git

      - name: Single player only, as webport.diff does
        working-directory: port
        run: |
          # Single player needs no curl and no TLS, and building them costs more
          # than the rest of the port put together; the unit tests are not part
          # of what a build of a page needs either.
          sed -i 's/ -lssl -lcrypto//' build_luanti.sh
          sed -i '/-DCURL_LIBRARY=/d; /-DCURL_INCLUDE_DIR=/d' build_luanti.sh
          # The page hands the zips over through the module's memory, and recent
          # Emscripten only exports the heap views when they are asked for.
          sed -i 's/EXPORTED_RUNTIME_METHODS=ccall,cwrap/EXPORTED_RUNTIME_METHODS=ccall,cwrap,HEAPU8,HEAPU32/' build_luanti.sh
          sed -i 's/-DENABLE_UPDATE_CHECKER=0/-DENABLE_UPDATE_CHECKER=0 -DENABLE_CURL=FALSE -DBUILD_UNITTESTS=FALSE/' build_luanti.sh
          # No flag is added to LDFLAGS: CMake's compile checks link with it,
          # and anything they do not know fails them (which reads as "SDL2 is
          # too old").  The symbol map is made by re-linking further down.
          if ! grep -q 'DIAG main thread heartbeat' sources/luanti/src/server.cpp; then
            echo "::warning::the heartbeat is not in server.cpp"
          fi
          sed -i 's/-DCMAKE_INSTALL_PREFIX/-DZSTD_BUILD_SHARED=OFF -DCMAKE_INSTALL_PREFIX/' build_zstd.sh
          sed -i 's/-DCMAKE_INSTALL_PREFIX/-DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX/' build_libzip.sh
          grep -n 'ENABLE_CURL\|EXPORTED_RUNTIME_METHODS\|^export LDFLAGS=' build_luanti.sh

      - name: Build the dependencies
        working-directory: port
        run: |
          if [ -f .deps-ok ]; then
            echo "restored from the cache"
            exit 0
          fi
          ./build_zstd.sh
          ./build_libarchive.sh
          ./build_webshims.sh
          ./build_libzip.sh
          touch .deps-ok

      - name: Build the webshims the gateways speak
        # A restored cache holds the revision the port pins, so the checkout and
        # the library Luanti links against are both replaced here. On a fresh
        # cache the step above has already built the right one, and this only
        # builds it once more.
        working-directory: port
        run: |
          set -euo pipefail
          if [ "$(git -C sources/webshims rev-parse -q HEAD 2>/dev/null || true)" != "$WEBSHIMS_REV" ]; then
            rm -rf sources/webshims
            git clone --quiet https://github.com/paradust7/webshims.git sources/webshims
            git -C sources/webshims checkout --quiet "$WEBSHIMS_REV"
          fi
          ./build_webshims.sh

      - name: Install the emscripten SDL2 port
        # -sUSE_SDL=2 means "the port", and a port is unpacked into the sysroot
        # the first time a build asks for it. That unpacking is not part of the
        # cache if the cache was first saved before any build got this far, and
        # irr/'s version check then compiles #include <SDL_version.h> against a
        # sysroot that has no such header: the configure stops with "SDL2 is too
        # old, required is at least 2.0.10!", which names neither the port nor
        # the missing file. Asking for it here says which it was.
        working-directory: port
        run: |
          set +e
          source emsdk/emsdk_env.sh >/dev/null 2>&1
          hdr=emsdk/upstream/emscripten/cache/sysroot/include/SDL2/SDL_version.h
          if [ -f "$hdr" ]; then
            echo "the SDL2 headers are in the sysroot"
            exit 0
          fi
          echo "::warning::the SDL2 port is not in the sysroot; installing it"
          embuilder build sdl2 2>&1 | tail -n 10
          if [ -f "$hdr" ]; then
            echo "the SDL2 port is installed"
            exit 0
          fi
          echo "::error::embuilder could not install the SDL2 port"
          exit 1

      - name: Build Luanti
        working-directory: port
        run: |
          set -o pipefail
          # Its own build tree, from nothing: CMake keeps what it was told the
          # first time (the linker flags a run with LDFLAGS in the environment
          # had, for one), and the tree the cache hands back is then configured
          # against flags this run does not have. What the cmake checks in irr/
          # answer depends on that, and a stale answer reads as "SDL2 is too
          # old". Only Luanti's tree goes: the dependencies below build/ are
          # the ones the cache restored.
          rm -rf build/luanti
          if ./build_luanti.sh > build.log 2>&1; then
            tail -n 15 build.log
            exit 0
          fi
          # The job log needs a token to read, the annotations on the commit do
          # not, so what broke goes where the checks page shows it.
          grep -n -i -E 'CMake Error|error:|fatal error|undefined reference|No such file' build.log \
            | head -n 8 \
            | while IFS= read -r line; do echo "::error::$line"; done
          # What CMake was in the middle of when it stopped, which the lines
          # above do not say.
          tail -n 12 build.log \
            | while IFS= read -r line; do echo "::error::… $line"; done
          # A check that fails says only that it failed; what the compiler said
          # about it is in CMakeError.log, and nowhere the checks page shows.
          errlog=$(find build -name CMakeError.log -print -quit)
          if [ -n "$errlog" ]; then
            echo "::error::$(grep -i -A6 -E 'SDL_version|SDL2' "$errlog" \
              | tr '\n' '|' | head -c 1200)"
          fi
          tail -n 40 build.log
          exit 1

      - name: Re-link the same objects for a symbol map
        working-directory: port
        run: |
          set -uo pipefail
          # TEMPORARY. The stack the page saves says wasm-function[4844], and
          # the release binary has no names to look it up in.  Running the very
          # link CMake made, with --emit-symbol-map and nothing else, writes
          # bin/luanti.js.symbols beside it.  What this step found is an
          # annotation, because the job log needs a token to read.
          root=$PWD
          link=$(find "$root/build" -name link.txt -path '*luanti.dir*' -print -quit 2>/dev/null)
          if [ -z "$link" ]; then
            echo "::error::relink: no link.txt under $root/build"
            exit 1
          fi
          # The target sits in src/, so the link file is
          # <binary dir>/src/CMakeFiles/luanti.dir/link.txt and its object paths
          # are relative to src/, not to the binary dir.  Both are tried, since
          # only the build itself knows which one the link expects.
          srcdir=$(cd "$(dirname "$link")/../.." && pwd)
          topdir=$(cd "$srcdir/.." && pwd)
          echo "::warning::relink: link=$link srcdir=$srcdir topdir=$topdir"
          for d in "$srcdir" "$topdir"; do
            if ( cd "$d" && eval "$(cat "$link") --emit-symbol-map" ) \
                   > /tmp/relink.log 2>&1; then
              sym=$(find "$topdir" -maxdepth 3 -name 'luanti.js.symbols' -print -quit)
              if [ -n "$sym" ] && [ "$(dirname "$sym")" != "$topdir/bin" ]; then
                mkdir -p "$topdir/bin"
                cp "$sym" "$topdir/bin/luanti.js.symbols"
              fi
              echo "::warning::relink ok in $d: $(ls -l "$topdir/bin/luanti.js.symbols" 2>/dev/null || echo 'no symbol file')"
              exit 0
            fi
            echo "::warning::relink failed in $d: $(tail -n 2 /tmp/relink.log | tr '\n' ' ')"
          done
          exit 1

      - name: Keep the stack of a worker's error, for the crash no log explains
        working-directory: port
        run: |
          set -euo pipefail
          # TEMPORARY. A worker's uncaught error reaches the page as a message
          # with no stack at all ("null function"), which names nothing.  This
          # keeps the worker's own stack in a file the page can read.
          cat >> build/luanti/bin/luanti.js <<'EOF'
          (function () {
            if (typeof addEventListener !== "function") return;
            addEventListener("error", function (ev) {
              var text = "[diag] " + new Date().toISOString() + " " +
                (ev && ev.message ? ev.message : "error") + "\n" +
                ((ev && ev.error && ev.error.stack) || "no stack") + "\n";
              try { console.error(text); } catch (e) {}
              try {
                navigator.storage.getDirectory().then(function (root) {
                  return root.getDirectoryHandle("luanti", { create: true });
                }).then(function (dir) {
                  return dir.getFileHandle("diag.txt", { create: true });
                }).then(function (file) {
                  return file.createWritable();
                }).then(function (w) {
                  return w.write(text).then(function () { return w.close(); });
                });
              } catch (e) {}
            });
          })();
          EOF

      - name: Stage the zips the play page loads
        run: |
          set -euo pipefail
          # Which command broke is only in the log, which needs a token; the
          # line number goes where the checks page shows it.
          trap 'echo "::error::staging failed at line $LINENO"' ERR
          git clone https://github.com/luanti-org/minetest_game.git minetest_game
          git -C minetest_game checkout "$MTG_REV"
          inst="$PWD/port/build/luanti-install"
          # Absolute: zip runs in a subshell that has changed directory.
          stage="$PWD/stage"
          rm -rf "$stage"
          mkdir -p "$stage/base/bin" "$stage/base/cache" "$stage/games"
          cp -r "$inst"/builtin "$inst"/client "$inst"/fonts "$inst"/locale "$inst"/textures "$stage/base/"
          echo "This is here to ensure bin exists" > "$stage/base/bin/readme.txt"
          # No update check, and no prompts about Minetest Game or key codes
          printf 'update_last_checked = disabled\nno_mtg_notification = true\nno_keycode_migration_warning = true\n' > "$stage/base/cache/common.conf"
          git -C minetest_game archive --format=tar --prefix=minetest_game/ HEAD | tar -x -C "$stage/games"
          rm -rf "$stage/games/minetest_game/.github" "$stage/games/minetest_game/utils" "$stage/games/minetest_game"/.[a-z]*
          # Fixed timestamps, so the same files give the same zips
          find "$stage" -exec touch -d 2000-01-01T00:00:00Z {} +
          z() { (cd "$1" && find . -type f | LC_ALL=C sort | sed 's|^\./||' | TZ=UTC zip -q -X -9 -@ "$2"); }
          z "$stage/base" "$stage/base.zip"
          z "$stage/games" "$stage/games.zip"
          b=$(sha256sum "$stage/base.zip" | cut -c1-12)
          g=$(sha256sum "$stage/games.zip" | cut -c1-12)
          mkdir -p out
          mv "$stage/base.zip" "out/luanti-$b.zip"
          mv "$stage/games.zip" "out/minetest-game-$g.zip"
          rm -rf "$stage"
          cp port/build/luanti/bin/luanti.js port/build/luanti/bin/luanti.wasm out/
          # TEMPORARY, with the relink above: the map from wasm function index
          # to name, so a saved stack can be read.
          cp port/build/luanti/bin/luanti.js.symbols out/ \
            || echo "::warning::there is no symbol map"
          # The page, and the manifest that names the zips by the hash of
          # their contents so that a visit only unpacks what changed.
          cp luanti/wasmgame/web/index.html luanti/wasmgame/web/launcher.js \
             luanti/wasmgame/web/menu.js luanti/wasmgame/web/import-game.js \
             luanti/wasmgame/web/mod-handoff.js luanti/wasmgame/web/_headers out/
          python3 -c 'import json,sys; b,g=sys.argv[1:3]; json.dump({"base":{"file":"luanti-%s.zip"%b,"version":"%s-1"%b},"game":{"file":"minetest-game-%s.zip"%g,"name":"minetest_game","version":g}}, open("out/packs.json","w"), indent=1)' "$b" "$g"
          ls -l out

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: luanti-wasm
          path: out/
          if-no-files-found: error
